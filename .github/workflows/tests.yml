name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
      - run: test -z "$(gofmt -l main.go main_test.go)"
      - run: go vet ./...
      - run: go test -race -count=1 -cover ./...
